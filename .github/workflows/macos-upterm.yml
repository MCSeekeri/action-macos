name: macos-upterm

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repository to check out"
        required: true
        default: "NixOS/nixpkgs"
      ref:
        description: "Git ref (branch, tag, or commit)"
        required: true
        default: "master"
      runner:
        description: "macOS runner label"
        required: true
        default: "macos-latest"
      users:
        description: "Comma-separated GitHub logins allowed to SSH (empty = the actor)"
        required: false
        default: ""
      checkout:
        description: "Check out the repository"
        type: boolean
        default: true
      install-nix:
        description: "Install Nix"
        type: boolean
        default: true
      wait-timeout-minutes:
        description: "Close the session if nobody connects"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  upterm:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v7
        if: inputs.checkout
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - uses: cachix/install-nix-action@v31
        if: inputs.install-nix
        with:
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes

      # upterm authenticates through GitHub; this file is only for a plain sshd.
      - name: Configure SSH authorized keys
        env:
          SSH_AUTHORIZED_KEYS: ${{ secrets.SSH_AUTHORIZED_KEYS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          : > ~/.ssh/authorized_keys
          if [ -n "${SSH_AUTHORIZED_KEYS:-}" ]; then
            printf '%s\n' "$SSH_AUTHORIZED_KEYS" >> ~/.ssh/authorized_keys
          else
            curl -fsSL "https://github.com/${GITHUB_ACTOR}.keys" >> ~/.ssh/authorized_keys
          fi
          chmod 600 ~/.ssh/authorized_keys

      - name: start upterm session (actor)
        id: upterm-actor
        if: inputs.users == ''
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          limit-access-to-actor: true
          full-access: true
          wait-timeout-minutes: ${{ inputs.wait-timeout-minutes }}

      - name: start upterm session (users)
        id: upterm-users
        if: inputs.users != ''
        uses: owenthereal/action-upterm@v2
        with:
          detached: true
          limit-access-to-users: ${{ inputs.users }}
          full-access: true
          wait-timeout-minutes: ${{ inputs.wait-timeout-minutes }}

      - name: publish SSH config
        env:
          SSH_CONFIG_ACTOR: ${{ steps.upterm-actor.outputs.ssh-config }}
          SSH_CONFIG_USERS: ${{ steps.upterm-users.outputs.ssh-config }}
        run: |
          config="${SSH_CONFIG_ACTOR:-$SSH_CONFIG_USERS}"
          if [ -z "$config" ]; then
            echo "no SSH config from upterm" >&2
            exit 1
          fi
          printf '%s\n' "$config" > upterm-ssh-config.txt
          {
            echo "## upterm session"
            echo '```sshconfig'
            cat upterm-ssh-config.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: upterm-ssh-config
          path: upterm-ssh-config.txt
          if-no-files-found: error
